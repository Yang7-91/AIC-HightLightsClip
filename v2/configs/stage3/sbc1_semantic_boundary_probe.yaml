schema_version: stage3.sbc1_semantic_boundary_probe.v1
stage: Stage 3 diagnostic
method: SBC-1
name: Multi-Prompt Multi-View Semantic Boundary Classifier Probe
diagnostic_only: true
deployable_method: false

data:
  role: dev_tune_or_validation
  require_oracle_labels: true
  oracle_label_search_paths:
    - runs/**/boundary_oracle_labels.jsonl
    - outputs/**/boundary_oracle_labels.jsonl
    - /root/autodl-tmp/outputs/**/boundary_oracle_labels.jsonl

sampling:
  seed: 20260922
  max_samples_total: 240
  max_per_label_per_side: 40
  labels: [TRIM, KEEP, EXPAND]
  sides: [left, right]
  stratified: true

video_context:
  boundary_window_sec: 4.0
  core_window_sec: 4.0
  fps: 2.0
  max_clip_sec: 8.0
  variant_shift_sec: 1.5
  variant_window_sec: 2.0
  input_modes:
    - boundary_clip
    - core_plus_boundary
    - variant_ranking

model:
  backend: openai_compatible_vllm
  base_url: http://127.0.0.1:8000/v1
  model: Qwen/Qwen3.5-4B
  temperature: 0.0
  top_p: 1.0
  max_tokens: 512
  timeout_sec: 300.0
  response_format:
    type: json_object
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

prompt_variants:
  - id: P1_ACTION_V2
    file: v2/prompts/stage3_sbc1_p1_action_v2.md
    action_field: action
  - id: P2_VARIANT_RANKING_V1
    file: v2/prompts/stage3_sbc1_p2_variant_ranking_v1.md
    action_field: best_variant
  - id: P3_CORE_CONTRAST_V1
    file: v2/prompts/stage3_sbc1_p3_core_contrast_v1.md
    action_field: action

decision_rules:
  schema_success_rate_min: 0.95
  macro_f1_min: 0.45
  auc_like_min: 0.65
  p2_priority_if_tie: true

safety:
  no_hard: true
  no_heldout: true
  no_training: true
  no_stage4: true
  no_stage5: true
  does_not_modify_stage2_stage3_mainline: true
