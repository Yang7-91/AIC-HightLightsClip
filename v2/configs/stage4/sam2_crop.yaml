schema_version: stage4.v1

runtime:
  # center: 单个区间跟踪失败时仍输出合法的最大中心构图；error: 直接失败。
  interval_error_policy: center

visualization:
  # 只控制调试产物的采样，不改变 SAM2 的逐帧传播频率。
  enabled: true
  sample_fps: 6.0
  always_save_anchor_frames: true
  always_save_fallback_frames: true
  mask_alpha: 0.35
  save_images: true
  write_video: false

tracking:
  # 默认 OpenCV 后端无需新模型。可通过 CLI 切换 center 或 sam2。
  backend: opencv
  initial_width_ratio: 0.28
  initial_height_ratio: 0.38
  saliency_max_side: 320
  max_corners: 120
  min_confidence: 0.15
  min_area_ratio: 0.001
  max_area_ratio: 0.75
  max_area_change: 3.0
  max_center_jump: 0.20
  reinitialize_every_frames: 150
  checkpoint: model_store/sam2/sam2.1_hiera_small.pt
  model_config: configs/sam2.1/sam2.1_hiera_s.yaml
  device: cuda
  amp_dtype: bfloat16
  # SAM2 严格按 Stage 1 镜头切分状态；每个有效 Qwen 点作为下一窗口的新条件帧。
  # 锚点 Mask 若离 Qwen 点过远，会追加正点提示纠偏；仍无效则仅回退该锚点窗口。
  anchor_max_center_distance_ratio: 0.20
  correction_with_point_prompt: true
  offload_video_to_cpu: true
  offload_state_to_cpu: false
  async_loading_frames: false

crop_candidates:
  # 固定为目标比例下的最大合法框，只比较主体中心轨迹，避免动态尺度干扰实验。
  fixed_maximum: true
  scales: [0.55, 0.70, 0.85, 1.0]
  offsets: [-0.12, 0.0, 0.12]
  # 裁剪内边距占裁剪框比例
  subject_margins: [0.20, 0.20, 0.15, 0.30]
  motion_look_ahead: 2.0

composition:
  weights:
    uncovered: 0.55
    centering: 0.25
    zoom: 0.20

optimizer:
  center_weight: 0.20
  scale_weight: 0.12

smoothing:
  # 纯 Qwen 线性插值 + 最大框就是 baseline 轨迹，不再叠加会造成滞后的单向 EMA。
  # bypass_for_interpolated_qwen为true时，表示原始 baseline 轨迹不使用EMA平滑
  bypass_for_interpolated_qwen: true
  # 中心 EMA 系数，默认 0.25，越小越平滑。
  center_alpha: 0.25
  width_alpha: 0.15
  max_center_step_ratio: 0.04
