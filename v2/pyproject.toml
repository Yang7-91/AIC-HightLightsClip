[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-highlight"
version = "0.1.0"
description = "Video highlight inference pipeline with a Stage 3.5 subject-point bridge"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.10",
  "scenedetect==0.7.1",
  "PyYAML>=6.0",
  "openai>=3.8.0",
]

[project.optional-dependencies]
grounded-sam2 = [
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "transformers>=4.46",
  "Pillow>=10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
